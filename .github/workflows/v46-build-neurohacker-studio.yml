name: V4.6 Build Neurohacker Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v46-build-neurohacker-studio.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          path: controller
      - name: Checkout CharacterStudio
        uses: actions/checkout@v4
        with:
          repository: M3-org/CharacterStudio
          ref: main
          path: studio
      - name: Checkout composable character assets
        uses: actions/checkout@v4
        with:
          repository: memelotsqui/character-assets
          ref: main
          path: studio/public/character-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Configure Neurohacker-only catalog
        working-directory: studio
        run: |
          cat > public/manifest.json <<'JSON'
          {
            "characters": [
              {
                "name": "V4.6 Modern Companion",
                "description": "Short hair · sweater · modern outfit",
                "portrait": "./character-assets/neurohacker/neurohacker_icon.png",
                "manifest": "./character-assets/neurohacker/manifest.json",
                "format": "vrm"
              }
            ],
            "loras": [],
            "sprites": [],
            "thumbnails": [],
            "defaultAnimations": [
              {
                "name": "T-Pose",
                "description": "T-Pose",
                "location": "./animations/T-Pose.fbx",
                "icon": "|"
              },
              {
                "name": "Waving",
                "description": "Basic Waving Animation",
                "location": "./animations/Waving.fbx",
                "icon": "|"
              }
            ]
          }
          JSON
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          assets = Path('public/character-assets')
          catalog=json.loads(Path('public/manifest.json').read_text())
          manifest=json.loads((assets/'neurohacker/manifest.json').read_text())
          assert len(catalog['characters']) == 1
          groups={item['trait']: {entry['id'] for entry in item['collection']} for item in manifest['traits']}
          required={
              'head': {'short','hairshort'},
              'chest': {'sweater','simpleshirt'},
              'legs': {'tightjeans','workingpants'},
              'body': {'0'},
              'eyes': {'regulareyes'},
          }
          for group, ids in required.items():
              assert group in groups, group
              assert ids & groups[group], (group, ids, groups[group])

          for child in assets.iterdir():
              if child.name == 'neurohacker':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          print(json.dumps({'groups': sorted(groups), 'targetTraits': required}, default=list, indent=2))
          PY
          du -sh public/character-assets/neurohacker
      - name: Install dependencies
        working-directory: studio
        run: npm ci
      - name: Run tests
        working-directory: studio
        run: npm run test:run -- --passWithNoTests
      - name: Build production studio
        working-directory: studio
        run: npm run build
      - name: Verify production build
        working-directory: studio
        run: |
          test -s build/index.html
          test -s build/manifest.json
          grep -R "V4.6 Modern Companion" build >/dev/null
          test -s build/character-assets/neurohacker/manifest.json
          test ! -e build/character-assets/drophunter
          test ! -e build/character-assets/_utilities
          du -sh build
          find build -maxdepth 2 -type f | sort | head -100
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: v46-neurohacker-studio-build
          path: studio/build
          retention-days: 14
