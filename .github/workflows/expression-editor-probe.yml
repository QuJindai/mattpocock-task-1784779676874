name: Advanced LivePortrait Expression Probe

on:
  push:
    branches: [avatar-showcase-lab]
    paths:
      - zerogpu-probe/expression-probe.mjs
      - zerogpu-probe/package.json
      - .github/workflows/expression-editor-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: zerogpu-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gradio client 1.10
        run: npm install

      - name: Run expression probe
        run: node expression-probe.mjs

      - name: Upload expression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-liveportrait-expression-probe
          path: zerogpu-probe/expression-artifacts/
          if-no-files-found: error
          retention-days: 7
