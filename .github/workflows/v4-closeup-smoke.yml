name: V4 Closeup Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v4-closeup-smoke.mjs
      - .github/workflows/v4-closeup-smoke.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Validate true Alicia closeup
        run: node v4-closeup-smoke.mjs
      - name: Upload closeup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrm-v4-closeup-smoke
          path: v4-closeup-smoke
          retention-days: 14
