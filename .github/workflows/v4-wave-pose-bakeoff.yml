name: V4 Wave Pose Bake-off

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v4-wave-pose-bakeoff.mjs
      - .github/workflows/v4-wave-pose-bakeoff.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Search Alicia wave poses
        run: node v4-wave-pose-bakeoff.mjs
      - name: Upload pose comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrm-v4-wave-pose-bakeoff
          path: v4-wave-pose-bakeoff
          retention-days: 14
