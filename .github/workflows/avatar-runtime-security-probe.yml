name: Avatar Runtime Security Probe

on:
  push:
    branches: [avatar-showcase-lab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe custom origin and rate boundary
        run: node avatar-runtime-security-probe.mjs

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-runtime-security-probe
          path: avatar-runtime-security-artifacts/
          if-no-files-found: error
          retention-days: 14
