name: Avatar v0.7 Preview Acceptance

on:
  push:
    branches: [avatar-showcase-v0.7]
    paths:
      - 'avatar-v07/scripts/cloud-acceptance.mjs'
      - '.github/workflows/avatar-v07-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AVATAR_URL: https://avatar-showcase-8zmi5auma-qujindai.vercel.app
      AVATAR_ACCESS_URL: https://avatar-showcase-8zmi5auma-qujindai.vercel.app/?_vercel_share=jmxjQm295013W7sjE0kVLoC7VhsaitXG
      AVATAR_ASSET_COMMIT: e2d0ec7dd0abda4fd4f70ec0780cbcf25d383d23
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: avatar-showcase-v0.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
        working-directory: avatar-v07

      - name: Run fail-closed Preview acceptance
        run: node scripts/cloud-acceptance.mjs
        working-directory: avatar-v07

      - name: Upload Preview acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-v07-preview-acceptance
          path: avatar-v07/avatar-v07-artifacts/
          if-no-files-found: error
          retention-days: 14
