name: V4.7 Production Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v47-production-acceptance.mjs
      - .github/workflows/v47-production-acceptance.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser controller
        run: |
          npm install playwright pngjs
          google-chrome --version || google-chrome-stable --version
      - name: Validate V4.7 Production
        env:
          V47_PRODUCTION_URL: https://vrm-showcase-lab.vercel.app
        run: node v47-production-acceptance.mjs
      - name: Upload V4.7 Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v47-production-acceptance
          path: v47-production-acceptance
          retention-days: 14
