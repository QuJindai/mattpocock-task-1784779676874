name: V4.6 CharacterStudio Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v46-characterstudio-probe.mjs
      - .github/workflows/v46-characterstudio-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright controller
        run: |
          npm init -y
          npm install playwright
          google-chrome --version || google-chrome-stable --version
      - name: Probe CharacterStudio online demo
        run: node v46-characterstudio-probe.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v46-characterstudio-probe
          path: v46-characterstudio-probe
          retention-days: 14
